<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="SAWEX — the online marketplace for the South African bulk wine industry. A product design project by Luzanne van der Watt.">
<title>SAWEX Prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700;800&display=swap">
<style>
/* Layout: full-width header + hero, one shared 1190px content column on every page, dark footer. Light-only, recreated from the 2017 screens.
   One type scale (13 / 15 / 17 / 19 / 30), one 4-based spacing scale, one control height (38px) across all pages. */
:root{
  color-scheme: light;
  --green:#9db04b; --green-dark:#8ca03f; --green-light:#c3d46b; --green-pale:#c9d5a0;
  --wine:#a01e4c; --wine-dark:#8a1741; --pink:#ecbcc6; --gold:#c9ab66; --olive:#9c8f2c;
  --ink:#333; --ink-2:#5a5a5a; --muted:#6b6b6b; --line:#e4e4e4; --field-line:#d6d6d6;
  --bg:#f7f7f7; --card:#fff; --disabled:#eef0f2; --footer:#323336;
  --font:"Montserrat", "Helvetica Neue", Arial, sans-serif;
  /* type scale */
  --fs-sm:13px; --fs-base:15px; --fs-md:17px; --fs-lg:19px; --fs-xl:30px;
  /* spacing scale */
  --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:24px; --s6:32px; --s7:48px; --s8:64px;
  --ctl:38px; --wrap:1190px; --gutter:32px; --pw:150px;
  --shadow:0 1px 4px rgba(0,0,0,.05);
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:var(--fs-base);line-height:1.5;-webkit-font-smoothing:antialiased;min-height:100%;display:flex;flex-direction:column}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit;line-height:1.2}
a{color:inherit}
:focus-visible{outline:2px solid var(--wine);outline-offset:2px}

/* ---------- Header ---------- */
.hdr{background:var(--card);height:76px;display:flex;align-items:center;justify-content:space-between;padding-left:max(var(--gutter), env(safe-area-inset-left,0px));padding-right:max(var(--gutter), env(safe-area-inset-right,0px));position:sticky;top:env(safe-area-inset-top,0px);z-index:30;box-shadow:0 1px 0 rgba(0,0,0,.05);transition:box-shadow .25s ease;view-transition-name:site-header}
.hdr.scrolled{box-shadow:0 6px 20px rgba(0,0,0,.07)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:31;background:var(--card)}
.logo{display:inline-flex;align-items:center;font-weight:700;font-size:36px;letter-spacing:-.5px;color:var(--green);text-decoration:none;line-height:1}
.logo .e{display:inline-flex;flex-direction:column;justify-content:space-between;width:.56em;height:.69em;margin-left:.04em}
.logo .e i{display:block;height:.12em;background:var(--green)}
.logo .e i:nth-child(2){width:88%}
.logo .x{color:var(--green-light);margin-left:-.2em;font-weight:700}
.nav{display:flex;align-items:center;height:100%}
.nav a.lnk{position:relative;display:flex;align-items:center;height:100%;padding:0 var(--s6);text-decoration:none;font-size:var(--fs-base);color:var(--ink);font-weight:500}
.nav a.lnk:hover{color:var(--wine)}
.nav a.lnk.active{color:var(--wine);font-weight:600}
.nav{position:relative}
.nav-ind{position:absolute;left:0;bottom:0;height:4px;width:0;background:var(--wine);pointer-events:none;opacity:0;transition:transform .4s cubic-bezier(.2,.8,.2,1), width .4s cubic-bezier(.2,.8,.2,1), opacity .2s ease}
.nav-ind.on{opacity:1}
::view-transition-old(site-header){display:none}
::view-transition-new(site-header){animation:none}
.vr{width:1px;height:40px;background:var(--line);margin:0 var(--s5)}
.avatar{width:40px;height:40px;border-radius:50%;background:var(--gold);color:#fff;font-size:18px;font-weight:500;display:grid;place-items:center;border:0;cursor:pointer}

/* ---------- Buttons (one size everywhere) ---------- */
.btn-sell,.btn-apply,.btn-out,.btn-primary,.btn-ghost,.btn-add{height:var(--ctl);border-radius:calc(var(--ctl)/2);padding:0 var(--s5);font-size:var(--fs-base);font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:var(--s2);cursor:pointer;text-decoration:none;white-space:nowrap;transition:background .15s,color .15s,border-color .15s}
.btn-sell{background:var(--wine);color:#fff;margin-left:var(--s3)}
.btn-sell:hover{background:var(--wine-dark)}
.btn-primary:hover{background:var(--green-dark)}
.btn-primary{background:var(--green);color:#fff;border:0;min-width:180px}
.actions .btn-primary{min-width:176px}
.btn-apply,.btn-add{border:0;background:var(--green);color:#fff}
.btn-apply:hover,.btn-add:not(:disabled):hover{background:var(--green-dark)}
.btn-add:disabled{background:var(--green-pale);cursor:default}
.btn-out{min-width:176px;border:1px solid var(--green);background:var(--card);color:var(--green)}
.btn-out:hover{background:var(--green);color:#fff}
.btn-ghost{border:1px solid var(--field-line);background:var(--card);color:var(--ink-2);font-weight:500}
.btn-ghost:hover{border-color:#bbb;color:var(--ink)}

.hero h1{margin:0;color:#fff;font-weight:600;font-size:var(--fs-xl);line-height:1.25;text-wrap:balance;text-shadow:0 1px 12px rgba(0,0,0,.15)}

/* ---------- Shared ---------- */
main{flex:1}
.wrap{max-width:calc(var(--wrap) + 2*var(--gutter));margin:0 auto;padding-left:max(var(--gutter), env(safe-area-inset-left,0px));padding-right:max(var(--gutter), env(safe-area-inset-right,0px))}
.card{background:var(--card);padding:var(--s6) var(--s6) var(--s7);box-shadow:var(--shadow);margin-bottom:var(--s7)}
h2{font-size:var(--fs-md);font-weight:600;color:var(--ink);margin:0 0 var(--s2);line-height:1.3}
.select{position:relative}
.select select,.dd-btn,.fld,.grp{height:var(--ctl);border:1px solid var(--field-line);border-radius:calc(var(--ctl)/2);background:var(--card);font-size:14px;color:var(--ink);width:100%}
.select select{appearance:none;-webkit-appearance:none;padding:0 40px 0 var(--s4);cursor:pointer}
.select select.ph,.filters .select select{color:var(--ink-2)}
.select::after{content:"";position:absolute;right:18px;top:19px;width:8px;height:8px;border-right:1px solid #999;border-bottom:1px solid #999;transform:translateY(-70%) rotate(45deg);pointer-events:none;transition:transform .28s cubic-bezier(.2,.8,.2,1)}
.select.open{z-index:41}
.select.open::after{transform:translateY(-15%) rotate(225deg)}
.select.enh select{display:none}
.dd-btn{display:flex;align-items:center;padding:0 40px 0 var(--s4);text-align:left;cursor:pointer;transition:border-color .15s, box-shadow .2s, background .15s}
.dd-btn span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dd-btn.ph,.filters .dd-btn{color:var(--ink-2)}
.select.open .dd-btn{border-color:var(--green);box-shadow:0 0 0 3px rgba(157,176,75,.16)}
.dd-list{position:absolute;left:0;right:0;top:calc(100% + 6px);z-index:40;margin:0;padding:6px;list-style:none;background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:0 14px 34px rgba(0,0,0,.12),0 2px 6px rgba(0,0,0,.06);max-height:264px;overflow-y:auto;overscroll-behavior:contain;opacity:0;visibility:hidden;transform:translateY(-6px) scale(.98);transform-origin:top center;transition:opacity .16s ease, transform .2s cubic-bezier(.2,.8,.2,1), visibility 0s linear .2s}
.select.up .dd-list{top:auto;bottom:calc(100% + 6px);transform-origin:bottom center;transform:translateY(6px) scale(.98)}
.select.open .dd-list{opacity:1;visibility:visible;transform:none;transition:opacity .18s ease, transform .26s cubic-bezier(.2,.8,.2,1), visibility 0s}
.dd-list li{display:flex;align-items:center;justify-content:space-between;gap:var(--s2);padding:9px 12px;border-radius:8px;font-size:14px;color:var(--ink);cursor:pointer;transition:background .12s}
.dd-list li.ph{color:var(--muted)}
.dd-list li.hl{background:#f2f5e8}
.dd-list li[aria-selected=true]{font-weight:500;color:var(--green-dark)}
.dd-list li[aria-selected=true]::after{content:"";flex:none;width:5px;height:9px;border-right:2px solid var(--green);border-bottom:2px solid var(--green);transform:rotate(45deg);margin:-3px 3px 0 0}
main{view-transition-name:page}
::view-transition-old(page){animation:pg-out .16s ease both}
::view-transition-new(page){animation:pg-in .34s cubic-bezier(.2,.8,.2,1) .04s both}
@keyframes pg-out{to{opacity:0;transform:translateY(-6px)}}
@keyframes pg-in{from{opacity:0;transform:translateY(14px)}}
.pg-enter{animation:pg-in .34s cubic-bezier(.2,.8,.2,1) both}
.rows.anim .row-wrap{animation:pg-in .36s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i,0)*35ms)}
.select select:disabled,.dd-btn:disabled,.fld:disabled,.fld[readonly],.grp.dis{background:var(--disabled);color:var(--ink-2);cursor:default}
.select select:hover:not(:disabled),.dd-btn:hover:not(:disabled),.fld:hover:not(:disabled):not([readonly]){border-color:#bdbdbd}
.fld{padding:0 var(--s4)}
.fld::placeholder,.grp input::placeholder{color:#6f6f6f}
.fld:focus,.fld:focus-visible,.grp input:focus,.grp input:focus-visible,.dd-btn:focus-visible{outline:none}
.fld:focus-visible,.grp:focus-within,.dd-btn:focus-visible{border-color:var(--green);box-shadow:0 0 0 3px rgba(157,176,75,.16)}
.fld,.grp{transition:border-color .15s, box-shadow .2s}

/* ---------- Listings ---------- */
.listings{display:grid;grid-template-columns:280px minmax(0,1fr);gap:var(--s6);align-items:start;padding-block:var(--s6) var(--s7)}
.filters{background:var(--card);padding:var(--s5);box-shadow:var(--shadow)}
.filters h2{margin-bottom:var(--s4)}
.filters form{display:grid;gap:var(--s4)}
.filters .btn-apply{margin-top:var(--s2)}
.clear{background:none;border:0;color:var(--muted);font-size:var(--fs-sm);cursor:pointer;text-decoration:underline;justify-self:center;padding:0}
.rows{display:grid;gap:var(--s3)}
.row{display:grid;grid-template-columns:minmax(0,1fr) var(--pw);background:var(--card);border-left:5px solid var(--stripe);min-height:76px;text-decoration:none;color:inherit;box-shadow:var(--shadow);transition:box-shadow .25s ease}
.row:hover,.row:focus-visible,.row-wrap:hover .row{box-shadow:0 0 16px -2px var(--glow)}
.row[data-type=white]{--stripe:var(--green);--glow:rgba(157,176,75,.38)}
.row[data-type=rose]{--stripe:var(--pink);--glow:rgba(226,140,162,.42)}
.row[data-type=red]{--stripe:var(--wine);--glow:rgba(160,30,76,.26)}
.row .main{display:flex;justify-content:space-between;align-items:flex-end;gap:var(--s3);padding:var(--s4) var(--s5);min-width:0}
.row h3{margin:0 0 var(--s1);font-size:var(--fs-lg);font-weight:500;line-height:1.3;color:var(--ink)}
.row .sub,.row .cert{font-size:var(--fs-sm);color:var(--muted)}
.row .cert{white-space:nowrap}
.row .price{border-left:1px solid var(--line);padding:var(--s4) var(--s5);display:flex;flex-direction:column;justify-content:center}
.row .price b{font-weight:500;font-size:var(--fs-lg);line-height:1.3;margin-bottom:var(--s1);white-space:nowrap}
.row .price span{font-size:var(--fs-sm);color:var(--muted)}
.empty{background:var(--card);padding:var(--s7) var(--s5);text-align:center;color:var(--ink-2);box-shadow:var(--shadow)}
.empty button{background:none;border:0;color:var(--green);text-decoration:underline;cursor:pointer;font-weight:500}

/* ---------- Detail ---------- */
.actions{display:flex;justify-content:flex-end;gap:var(--s3);padding-block:var(--s5) var(--s4);flex-wrap:wrap}
.d-top{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:var(--s1) var(--s5);align-items:baseline}
.d-top h1{margin:0;font-size:var(--fs-xl);font-weight:500;line-height:1.25;color:var(--ink);text-wrap:balance}
.d-price{font-size:26px;font-weight:600;color:var(--olive);text-align:right;white-space:nowrap}
.d-blend{color:var(--ink-2);font-size:var(--fs-base)}
.d-qty{font-size:var(--fs-md);text-align:right}
.d-region,.d-estate{font-size:var(--fs-md);margin-top:var(--s5)}
.d-estate{text-align:right}
.attrs{display:flex;flex-wrap:wrap;gap:var(--s4) 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line);margin-top:var(--s6);padding:var(--s5) 0}
.attr{width:144px;display:flex;flex-direction:column;align-items:center;gap:var(--s2);text-align:center;font-size:var(--fs-sm);line-height:1.3;color:var(--ink-2)}
.attr svg{width:44px;height:44px;stroke:#8d8d8d;fill:none;stroke-width:1.2;stroke-linecap:round;stroke-linejoin:round}
.attr .lbl{min-height:2.6em;display:flex;align-items:center}
.d-sec{border-bottom:1px solid var(--line);padding:var(--s6) 0}
.d-sec:last-child{border-bottom:0;padding-bottom:0}
.d-sec h2{margin-bottom:var(--s3)}
.d-sec p{margin:0;color:var(--ink-2);font-size:var(--fs-base);line-height:1.75;max-width:68ch}
.tbl-wrap{overflow-x:auto}
table.chem{border-collapse:collapse;font-size:var(--fs-sm);text-align:center;font-variant-numeric:tabular-nums;min-width:680px;width:100%;max-width:1060px}
table.chem th,table.chem td{border:1px solid var(--line);padding:var(--s2) var(--s3)}
table.chem th{font-weight:600;color:var(--muted);line-height:1.4}
table.chem td{color:var(--ink);font-weight:600}

/* ---------- Sell ---------- */
.sell{margin-top:var(--s6);color:var(--ink-2)}
.sell h1{margin:0 0 var(--s2);font-size:var(--fs-xl);font-weight:500;line-height:1.25;color:var(--ink)}
.sell p{margin:0;line-height:1.6;max-width:72ch}
.sell a:not(.btn-ghost){color:var(--green);text-decoration:none;font-weight:500}
.sell a:not(.btn-ghost):hover{text-decoration:underline}
.s-two{display:grid;grid-template-columns:1fr 1fr;gap:var(--s6) var(--s7);margin-top:var(--s6)}
.s-two > div{display:flex;flex-direction:column}
.s-two p{flex:1}
.s-pair{display:flex;align-items:center;gap:var(--s4);margin-top:var(--s4)}
.s-pair .fld{flex:1}
.sep{border:0;border-top:1px solid var(--line);margin:var(--s6) 0 0}
.s-block{padding-top:var(--s6)}
.grid3,.cult,.s-row{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:var(--s4) var(--s5);margin-top:var(--s4)}
.grp{display:flex;overflow:hidden}
.grp input{border:0;flex:1;min-width:0;padding:0 var(--s4);background:transparent;font-size:14px}
.grp input:disabled{cursor:default}
.grp .unit{width:40px;display:grid;place-items:center;border-left:1px solid var(--field-line);color:var(--ink-2);flex:none;font-size:14px}
.grp .unit.l{border-left:0;border-right:1px solid var(--field-line)}
.cult-last{display:flex;gap:var(--s3)}
.cult-last .grp{flex:1;min-width:0}
.cult-last .btn-add{flex:none;width:96px;padding:0}
.blend{min-height:12px;background:var(--disabled);margin-top:var(--s4);display:flex;flex-wrap:wrap;gap:var(--s2);border-radius:2px}
.blend:not(:empty){padding:var(--s2)}
.blend:empty{display:none}
.chip{display:inline-flex;align-items:center;gap:var(--s2);background:var(--card);border:1px solid var(--field-line);border-radius:15px;height:30px;padding:0 var(--s1) 0 var(--s3);font-size:var(--fs-sm);color:var(--ink)}
.chip button{border:0;background:none;width:22px;height:22px;border-radius:50%;cursor:pointer;color:var(--muted);line-height:1}
.chip button:hover{background:var(--disabled)}
.hint{margin-top:20px;font-size:var(--fs-sm)}
.hint.err{color:var(--wine)}
textarea.fld{height:auto;min-height:96px;padding:var(--s3) var(--s4);border-radius:6px;resize:vertical;display:block;margin-top:var(--s4);line-height:1.5}
.s-row{align-items:center}
.s-row .wood{display:flex;align-items:center;gap:var(--s3);color:var(--ink)}
.toggle{position:relative;width:46px;height:26px;flex:none}
.toggle input{position:absolute;inset:0;opacity:0;margin:0;cursor:pointer;z-index:1}
.toggle span{position:absolute;inset:0;border-radius:13px;background:#dcdcdc;transition:background .15s}
.toggle span::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.25);transition:transform .15s}
.toggle input:checked + span{background:var(--green)}
.toggle input:checked + span::after{transform:translateX(20px)}
.toggle input:focus-visible + span{outline:2px solid var(--wine);outline-offset:2px}
.checks{display:flex;gap:var(--s6);margin-top:var(--s4)}
.checks label{display:flex;align-items:center;gap:var(--s2);color:var(--ink);cursor:pointer}
.checks input{width:16px;height:16px;margin:0;accent-color:var(--green)}
.submit-row{display:flex;justify-content:flex-end;gap:var(--s3);margin-top:var(--s7);padding-top:var(--s5);border-top:1px solid var(--line)}
.invalid{border-color:var(--wine)!important}

/* ---------- Deal room (chat) ---------- */
.chat-page{padding-block:var(--s6) var(--s7)}
.chat-head{display:flex;align-items:center;justify-content:space-between;gap:var(--s4);flex-wrap:wrap;margin-bottom:var(--s5)}
.chat-head h1{margin:0;font-size:var(--fs-xl);font-weight:500;line-height:1.25}
.seg{display:inline-flex;align-items:center;gap:var(--s1);background:var(--card);border:1px solid var(--field-line);border-radius:20px;padding:3px;font-size:var(--fs-sm)}
.seg span{color:var(--muted);padding:0 var(--s2) 0 var(--s3)}
.seg button{height:30px;padding:0 var(--s4);border:0;border-radius:15px;background:transparent;cursor:pointer;font-weight:500;color:var(--ink-2);transition:background .2s,color .2s}
.seg button[aria-pressed=true]{background:var(--green);color:#fff}
.chat{display:grid;grid-template-columns:260px minmax(0,1fr);gap:var(--s5);margin-top:var(--s5);align-items:start}
.threads{display:flex;flex-direction:column;background:var(--card);box-shadow:var(--shadow)}
.thread{appearance:none;border:0;border-bottom:1px solid var(--line);background:var(--card);text-align:left;display:block;width:100%;padding:var(--s3) var(--s4);cursor:pointer;color:var(--ink);transition:background .2s,color .2s}
.thread:last-child{border-bottom:0}
.thread:hover{background:#f6f8ef}
.thread[aria-current=true]{background:var(--green);color:#fff}
.thread .t1{display:flex;justify-content:space-between;align-items:center;gap:var(--s2);font-weight:500;font-size:var(--fs-base)}
.badge{min-width:20px;height:20px;padding:0 6px;border-radius:4px;background:var(--olive);color:#fff;font-size:12px;font-weight:600;display:grid;place-items:center}
.thread .code{display:block;font-size:12px;font-weight:600;margin-top:2px;letter-spacing:.2px;word-break:break-all}
.thread .st{display:block;font-size:12px;color:var(--muted);margin-top:var(--s1);line-height:1.45}
.thread[aria-current=true] .st{color:rgba(255,255,255,.88)}
.thread:focus-visible{outline:2px solid var(--wine);outline-offset:-2px}
.convo{background:var(--card);box-shadow:var(--shadow);padding:var(--s4) var(--s5) var(--s6);min-width:0}
.convo-bar{display:flex;justify-content:flex-end;align-items:center;gap:var(--s4);padding-bottom:var(--s3);border-bottom:1px solid var(--line)}
.icon-btn{width:36px;height:36px;border:0;background:none;border-radius:50%;display:grid;place-items:center;cursor:pointer;color:var(--muted);transition:background .15s}
.icon-btn:hover{background:var(--disabled)}
.icon-btn svg,.send svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.vr-s{width:1px;height:24px;background:var(--line)}
.link-wine{border:0;background:none;color:var(--ink-2);font-weight:500;cursor:pointer;padding:6px 0}
.link-wine:hover{color:var(--ink);text-decoration:underline}
.link-wine:disabled{color:var(--muted);cursor:default;text-decoration:none}
.composer{display:flex;gap:var(--s3);align-items:center;padding:var(--s4) 0;border-bottom:1px solid var(--line)}
.composer textarea.fld{margin:0;min-height:56px;flex:1}
.send{width:44px;height:44px;border:0;background:var(--green);color:#fff;border-radius:50%;display:grid;place-items:center;cursor:pointer;flex:none;transition:background .15s}
.send svg{width:18px;height:18px;margin:2px 2px 0 0}
.send:hover:not(:disabled){background:var(--green-dark)}
.send:disabled{background:var(--disabled);color:var(--muted);cursor:default}
.feed{display:flex;flex-direction:column;gap:var(--s4);padding-top:var(--s5)}
.msg{width:min(420px,78%);border-radius:4px;padding:var(--s3) var(--s4) var(--s4);font-size:14px}
.msg.theirs{align-self:flex-start;background:var(--card);border:1px solid var(--field-line)}
.msg.mine{align-self:flex-end;background:#dfe5c6}
.msg header{display:flex;justify-content:space-between;align-items:baseline;gap:var(--s3);padding-bottom:var(--s2);margin-bottom:var(--s3);border-bottom:1px solid var(--line)}
.msg.mine header{border-bottom-color:rgba(0,0,0,.08)}
.msg h3{margin:0;font-size:var(--fs-base);font-weight:500}
.msg time{font-size:11px;color:var(--muted);white-space:nowrap}
.msg .t-only{display:block;text-align:right;margin-bottom:var(--s1)}
.msg p{margin:0;line-height:1.6;color:var(--ink);overflow-wrap:anywhere}
.msg-actions{display:grid;grid-template-columns:1fr 1fr;gap:var(--s3);margin-top:var(--s4)}
.msg-actions button{min-width:0;height:32px;padding:0}
.msg-actions svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.msg-note{margin-top:var(--s3);font-size:12px;color:var(--muted)}
.msg.fresh{animation:pg-in .36s cubic-bezier(.2,.8,.2,1) both}
@media (max-width:760px){
  .chat{grid-template-columns:1fr;gap:var(--s4)}
  .threads{flex-direction:row;overflow-x:auto}
  .thread{min-width:190px;border-bottom:0;border-right:1px solid var(--line)}
  .convo{padding:var(--s3) var(--s4) var(--s5)}
  .msg{width:min(420px,92%)}
}

/* ---------- Saved hearts ---------- */
.row-wrap{position:relative}
.heart{position:absolute;top:8px;right:calc(var(--pw) + 8px);width:36px;height:36px;border:0;background:transparent;border-radius:50%;display:grid;place-items:center;color:var(--muted);cursor:pointer;z-index:2;transition:background .15s,color .15s}
.heart svg,.heart-btn svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linejoin:round}
.heart-btn svg{width:16px;height:16px;stroke-width:1.9}
.heart:hover{background:var(--disabled);color:var(--wine)}
.heart[aria-pressed=true]{color:var(--wine)}
.heart[aria-pressed=true] svg,.heart-btn[aria-pressed=true] svg{fill:currentColor}
.heart-btn{min-width:0!important}
.pop svg{animation:pop .4s cubic-bezier(.2,.8,.2,1)}
@keyframes pop{40%{transform:scale(1.35)}}
.nav-badge{margin-left:6px;min-width:18px;height:18px;padding:0 5px;border-radius:4px;background:var(--olive);color:#fff;font-size:11px;font-weight:600;display:inline-grid;place-items:center;transform:translateY(-6px)}

/* ---------- Dashboard ---------- */
.dash{padding-block:var(--s6) var(--s7)}
.dash-head h1{margin:0;font-size:var(--fs-xl);font-weight:500;line-height:1.25}
.lede{margin:var(--s1) 0 0;color:var(--ink-2)}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:var(--s4);margin-top:var(--s5)}
.stat{appearance:none;border:0;border-top:3px solid var(--c);text-align:left;background:var(--card);box-shadow:var(--shadow);padding:var(--s4) var(--s5);cursor:pointer;color:var(--ink);transition:box-shadow .25s ease;min-width:0}
.stat:hover{box-shadow:0 0 16px -2px var(--glow)}
.stat[data-kind=white]{--c:var(--green);--glow:rgba(157,176,75,.38)}
.stat[data-kind=red]{--c:var(--wine);--glow:rgba(160,30,76,.26)}
.stat[data-kind=rose]{--c:var(--pink);--glow:rgba(226,140,162,.42)}
.stat[data-kind=gold]{--c:var(--gold);--glow:rgba(201,171,102,.42)}
.stat .lbl{display:block;font-size:var(--fs-sm);color:var(--ink-2);font-weight:500}
.stat b{display:block;font-size:30px;font-weight:500;line-height:1.2;margin:var(--s1) 0;font-variant-numeric:tabular-nums}
.stat .sm{display:block;font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dash-grid{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:var(--s5);margin-top:var(--s5);align-items:start}
.dash-col{display:grid;gap:var(--s5);min-width:0}
.panel{background:var(--card);box-shadow:var(--shadow);padding:var(--s5);scroll-margin-top:100px;min-width:0}
.panel-head{display:flex;justify-content:space-between;align-items:center;gap:var(--s3);flex-wrap:wrap;margin-bottom:var(--s4)}
.panel-head h2{margin:0}
.tabs{display:inline-flex;gap:var(--s1);background:var(--bg);border-radius:20px;padding:3px}
.tabs button{height:30px;padding:0 var(--s4);border:0;border-radius:15px;background:transparent;cursor:pointer;font-weight:500;font-size:var(--fs-sm);color:var(--ink-2);transition:background .2s,color .2s,box-shadow .2s}
.tabs button[aria-selected=true]{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.1)}
.panel .rows{display:grid;gap:var(--s3)}
.panel .row{box-shadow:none;border:1px solid var(--line);border-left:5px solid var(--stripe)}
.fade-in{animation:pg-in .3s cubic-bezier(.2,.8,.2,1) both}
.empty-s{padding:var(--s6) var(--s4);text-align:center;color:var(--ink-2);border:1px dashed var(--field-line);line-height:1.8}
.search-item{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:var(--s3);align-items:center;padding:var(--s4) 0;border-top:1px solid var(--line)}
.search-item:first-child{border-top:0;padding-top:0}
.search-item h3{margin:0;font-size:14px;font-weight:500}
.search-item .sub{font-size:12px;color:var(--muted);margin-top:2px}
.s-actions{display:flex;align-items:center;gap:var(--s4);flex-wrap:wrap}
.alert-t{display:flex;align-items:center;gap:var(--s2);font-size:var(--fs-sm);color:var(--ink-2);cursor:pointer}
.btn-out.sm{height:32px;min-width:0;padding:0 var(--s4);font-size:var(--fs-sm)}
.pill{display:inline-flex;align-items:center;height:22px;padding:0 10px;border-radius:11px;font-size:12px;font-weight:600;white-space:nowrap}
.pill.live{background:#eef2df;color:#56641c}
.pill.draft{background:var(--disabled);color:var(--ink-2)}
.pill.sold{background:#f3efdc;color:#6a6016}
.tbl{width:100%;border-collapse:collapse;font-size:14px;min-width:600px}
.tbl th{font-size:12px;font-weight:600;color:var(--muted);text-align:left;padding:0 var(--s3) var(--s2);border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:var(--s3);border-bottom:1px solid var(--line);vertical-align:middle;font-variant-numeric:tabular-nums}
.tbl tr:last-child td{border-bottom:0}
.tbl th:first-child,.tbl td:first-child{padding-left:0}
.tbl th:last-child,.tbl td:last-child{padding-right:0;text-align:right}
.tbl .num{text-align:right}
.tbl .w a{font-weight:500;text-decoration:none;color:var(--ink)}
.tbl tbody tr{transition:background .15s}
.tbl th:first-child,.tbl td.w{padding-left:var(--s4)}
.tbl td.w{position:relative}
.tbl td.w::before{content:"";position:absolute;left:0;top:var(--s3);bottom:var(--s3);width:4px;background:var(--line)}
.tbl tr[data-type=white] td.w::before{background:var(--green)}
.tbl tr[data-type=rose] td.w::before{background:var(--pink)}
.tbl tr[data-type=red] td.w::before{background:var(--wine)}
.tbl tbody tr:hover{background:var(--bg)}
.tbl .w small{display:block;color:var(--muted);font-size:12px}
.lnk-g{color:var(--green-dark);font-weight:600;text-decoration:none;font-size:var(--fs-sm);background:none;border:0;cursor:pointer;padding:0}
.lnk-g:hover{text-decoration:underline}
.attn{list-style:none;margin:0;padding:0}
.attn li{display:grid;grid-template-columns:8px minmax(0,1fr) auto;gap:var(--s3);align-items:center;padding:var(--s3) 0;border-top:1px solid var(--line)}
.attn li:first-child{border-top:0;padding-top:0}
.attn .dot{width:8px;height:8px;border-radius:50%;background:var(--wine)}
.attn .dot.s{background:var(--gold)}
.attn b{display:block;font-weight:500;font-size:14px}
.attn .sub{font-size:12px;color:var(--muted)}
.caught{color:var(--ink-2);font-size:14px;margin:0}
.sample{padding:var(--s4) 0;border-top:1px solid var(--line)}
.panel-head + .sample{border-top:0;padding-top:0}
.sample h3{font-size:14px;font-weight:500;margin:0 0 var(--s1)}
.sample h3 a{text-decoration:none}
.sample h3 a:hover{color:var(--wine)}
.sample .sub{font-size:12px;color:var(--muted);margin-bottom:var(--s3)}
.steps{display:grid;grid-template-columns:repeat(4,1fr);position:relative}
.steps::before,.steps .bar{content:"";position:absolute;left:12.5%;top:5px;height:2px;background:var(--line);right:12.5%}
.steps .bar{right:auto;background:var(--green);width:calc(75% * var(--p))}
.step{position:relative;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:11px;color:var(--muted);text-align:center}
.step i{width:12px;height:12px;border-radius:50%;background:var(--card);border:2px solid var(--field-line);z-index:1}
.step.done i{background:var(--green);border-color:var(--green)}
.step.cur i{box-shadow:0 0 0 4px rgba(157,176,75,.22)}
.step.done{color:var(--ink-2)}
.step.cur{color:var(--ink);font-weight:600}
.acct{margin:0;display:grid;gap:var(--s3)}
.acct div{display:flex;justify-content:space-between;gap:var(--s3);font-size:14px;align-items:baseline}
.acct dt{color:var(--ink-2)}
.acct dd{margin:0;font-weight:500;text-align:right}
.acct .ok{color:#56641c}
@media (max-width:1000px){
  .dash-grid{grid-template-columns:1fr}
  .stats{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (max-width:560px){
  .search-item{grid-template-columns:1fr}
  .stat{padding:var(--s3) var(--s4)}
  .stat b{font-size:24px}
}

.dtabs{display:flex;gap:var(--s6);border-bottom:1px solid var(--line);margin-top:var(--s5);overflow-x:auto;scroll-margin-top:96px}
.dtabs button{position:relative;border:0;background:none;padding:var(--s3) 0;font-size:var(--fs-base);font-weight:500;color:var(--ink-2);cursor:pointer;white-space:nowrap;transition:color .2s}
.dtabs button:hover{color:var(--ink)}
.dtabs{position:relative}
.dtabs .ind{position:absolute;left:0;bottom:0;height:3px;width:0;background:var(--wine);pointer-events:none;transition:transform .38s cubic-bezier(.2,.8,.2,1), width .38s cubic-bezier(.2,.8,.2,1)}
.dtabs button[aria-selected=true]{color:var(--wine);font-weight:600}

#dash-body{margin-top:var(--s5);display:grid;gap:var(--s5)}
.ov-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:var(--s5)}
.panel.ov{display:flex;flex-direction:column}
.count{display:inline-grid;place-items:center;min-width:24px;height:22px;padding:0 8px;border-radius:11px;background:var(--bg);font-size:12px;font-weight:600;color:var(--ink-2);margin-left:var(--s2);vertical-align:2px}
.mini{list-style:none;margin:0;padding:0}
.mini li{position:relative;display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:var(--s3);align-items:center;padding:var(--s3) var(--s2);margin:0 calc(-1 * var(--s2));border-radius:0;border-top:1px solid var(--line);transition:background .15s, border-color .15s}
.mini li:first-child{border-top-color:transparent}
.mini li:hover{background:var(--bg)}
.mini li:hover,.mini li:hover + li{border-top-color:transparent}
.mini li[data-respond]{cursor:pointer}
.m-main a::after{content:"";position:absolute;inset:0}
.mini li .btn-out,.mini li .pill{position:relative;z-index:1}
.mini .stripe{width:4px;align-self:stretch;min-height:34px;border-radius:0;background:var(--line)}
.mini .stripe[data-type=white]{background:var(--green)}
.mini .stripe[data-type=rose]{background:var(--pink)}
.mini .stripe[data-type=red]{background:var(--wine)}
.mini .dot{width:8px;height:8px;border-radius:50%;background:var(--wine)}
.mini .dot.s{background:var(--gold)}
.mini .dot.g{background:var(--green)}
.mini .dot[data-type=white]{background:var(--green)}
.mini .dot[data-type=rose]{background:var(--pink)}
.mini .dot[data-type=red]{background:var(--wine)}
.mini .dot[data-type=none]{background:var(--field-line)}
.m-main{min-width:0;display:flex;flex-direction:column}
.m-main a,.m-main b{font-weight:500;font-size:14px;text-decoration:none;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.m-main a:hover{color:var(--ink)}
.m-main .sub{font-size:12px;color:var(--muted)}
.prog{display:block;height:4px;border-radius:2px;background:var(--line);margin-top:6px;overflow:hidden;max-width:220px}
.prog i{display:block;height:100%;width:calc(100% * var(--p));background:var(--green);border-radius:2px}
.mini .heart{position:relative;top:auto;right:auto;z-index:1;width:32px;height:32px;justify-self:end;align-self:center;margin:0}
.d-title{display:flex;align-items:center;gap:var(--s2);min-width:0}
.d-heart{position:static;color:var(--wine);width:38px;height:38px;flex:none}
.d-heart svg{width:22px;height:22px}
.d-heart:hover{background:#f8e9ee;color:var(--wine)}
.ov-foot{margin-top:auto;padding-top:var(--s4)}
.ov .mini,.ov .caught{margin-bottom:var(--s2)}
.view-all{display:inline-flex;align-items:center;gap:6px;border:0;background:none;color:var(--green-dark);font-weight:600;font-size:var(--fs-sm);cursor:pointer;padding:0}
.view-all svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;transition:transform .2s}
.view-all:hover svg{transform:translateX(3px)}
.sample-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:var(--s4)}
.sample-grid .sample{border:1px solid var(--line);padding:var(--s4)}
@media (max-width:900px){.ov-grid,.sample-grid{grid-template-columns:1fr}.dtabs{gap:var(--s5)}}

.back{display:inline-flex;align-items:center;gap:6px;color:var(--ink-2);font-size:14px;font-weight:500;text-decoration:none;padding:6px 0;max-width:100%;min-width:0}
.back span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.back svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none;transition:transform .2s}
.back:hover{color:var(--ink)}
.back:hover svg{transform:translateX(-3px)}
.actions{align-items:center}
.actions .back{margin-right:auto}
.crumb{margin-bottom:var(--s3)}

/* ---------- Footer ---------- */
.ftr{background:var(--footer);color:#fff;font-size:var(--fs-sm);padding-block:var(--s5)}
.ftr .wrap{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:var(--s4)}
.ftr nav{display:flex;align-items:center}
.ftr nav a{text-decoration:none;color:#fff;cursor:pointer}

.ftr nav i{display:inline-block;width:1px;height:14px;background:rgba(255,255,255,.6);margin:0 var(--s5)}

.toast.show{opacity:1;transform:translate(-50%,0)}

/* ---------- Responsive ---------- */
@media (max-width:1100px){
  .nav a.lnk{padding:0 var(--s5)}
}

}

  .hero h1{font-size:22px}
  .logo{font-size:30px}
}
@media (max-width:560px){
  :root{--gutter:16px; --fs-xl:24px}
  .hdr{height:64px}
  .nav a.lnk,.vr{display:none}
  .avatar{margin-left:var(--s3);width:34px;height:34px;font-size:16px}
  .btn-sell{padding:0 var(--s4)}
  .logo{font-size:26px}
  :root{--pw:108px}
  .row .main{flex-direction:column;align-items:flex-start;gap:var(--s1);padding:var(--s3) var(--s4)}
  .row .price{padding:var(--s3) var(--s4)}
  .row h3,.row .price b{font-size:16px}
  .d-top{grid-template-columns:1fr}
  .d-price,.d-qty,.d-estate{text-align:left}
  .d-region{margin-top:var(--s4)}
  .d-estate{margin-top:0}
  .attr{width:50%}
  .card{padding:var(--s5) var(--s4) var(--s6)}
  .btn-out,.actions .btn-primary{min-width:0;flex:1;padding:0 var(--s3)}
  .actions .btn-out{flex:1 1 calc(50% - 6px);font-size:14px}
  .actions .btn-primary{flex:1 1 100%;order:3}
  .grid3,.cult,.s-row{grid-template-columns:1fr}
  .checks{flex-wrap:wrap;gap:var(--s3) var(--s5)}
  .submit-row .btn-primary{flex:1;min-width:0}
}

<script>
const LISTINGS = [

   desc:"A bright, dark red wine with black cherry, plums, cinnamon spice and nutmeg flavours. The palate has a refreshing acidity with undertones of raspberry & blackberry and a savoury, mineral finesse on the finish.",
   chem:[1,13.5,15,2.3,12,5.2,0.55,25,75,3.6]}
];
const CHEM_HEAD = ["Density<br>20˚C","Alcohol<br>Vol%","Total<br>extract g/l","Residual<br>sugar g/l","Sugarfree<br>extract g/l","Total acid<br>g/l","Volatile<br>acidity g/l","Free SO2<br>mg/l","Total SO2<br>mg/l","pH"];
const ORIGINS = ["Breedekloof","Cape South Coast","Durbanville","Franschhoek","Kwazulu-Natal","Olifants River","Paarl","Robertson","Stellenbosch","Swartland","Worcester"];
const CULTIVARS = ["Cabernet Sauvignon","Chardonnay","Chenin Blanc","Cinsault","Colombar","Merlot","Pinot Noir","Pinotage","Sauvignon Blanc","Shiraz"];
const VINTAGES = Array.from({length:13},(_,i)=>2017-i);
const FARMING = ["Biodynamic","Conventional","Integrated Production","Organic"];
const TYPES = {red:"Red", white:"White", rose:"Rosé"};

const app = document.getElementById("app");
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const rand = n => { const s = (Math.round(n*100)/100).toFixed(2).replace(/\.00$/,"").replace(".", ","); return s.replace(/,(\d)$/, ",$10"); };
const litres = n => n.toLocaleString("en-ZA").replace(/[ ,.]/g," ") + "L";
const title = l => `${l.vintage} ${l.cultivars.map(c=>c[0]).join(", ")}`;
const opts = (arr, ph) => `<option value="">${ph}</option>` + arr.map(v=>`<option value="${esc(v)}">${esc(v)}</option>`).join("");

let filters = {cultivar:[], vintage:[], origin:[], sawis:[], farming:[]};

/* ---------- Toast ---------- */
let tt;
function toast(msg){ const t=document.getElementById("toast"); t.textContent=msg; t.classList.add("show"); clearTimeout(tt); tt=setTimeout(()=>t.classList.remove("show"),2400); }
document.addEventListener("click", e => { if (e.target.closest("[data-soon]")) toast("This page isn’t part of the prototype yet"); });
document.getElementById("avatar").addEventListener("click", ()=>toast("Account menu isn’t part of the prototype yet"));

/* ---------- Listings view ---------- */
function viewListings(){
  app.innerHTML = `
  <section class="hero"><h1>The online marketplace for the South African bulk wine industry</h1></section>
  <div class="wrap listings">
    <aside class="filters">
      <h2>Filters</h2>
      <form id="ff">
        <div class="select"><select id="f-cultivar" multiple aria-label="Cultivar">${opts(CULTIVARS,"Select Cultivar")}</select></div>
        <div class="select"><select id="f-vintage" multiple aria-label="Vintage">${opts(VINTAGES,"Select Vintage")}</select></div>
        <div class="select"><select id="f-origin" multiple aria-label="Origin">${opts(ORIGINS,"Select Origin")}</select></div>
        <div class="select"><select id="f-sawis" multiple aria-label="SAWIS certification"><option value="">Select Certification</option><option value="yes">SAWIS Certified</option><option value="no">Not SAWIS Certified</option></select></div>
        <div class="select"><select id="f-farming" multiple aria-label="Farming practice">${opts(FARMING,"Select Farming Practice")}</select></div>
        <button class="btn-apply" type="submit">Apply</button>
        <button class="clear" type="button" id="fclear" hidden>Clear filters</button>
      </form>
    </aside>
    <section class="rows" id="rows" aria-label="Listings"></section>
  </div>`;
  const f = document.getElementById("ff");
  for (const k in filters) [...document.getElementById("f-"+k).options].forEach(o => o.selected = !!o.value && filters[k].includes(o.value));
  f.addEventListener("submit", e => {
    e.preventDefault();
    for (const k in filters) filters[k] = [...document.getElementById("f-"+k).selectedOptions].map(o => o.value).filter(Boolean);
    renderRows(true);
  });
  document.getElementById("fclear").addEventListener("click", clearFilters);
  renderRows();
}
function clearFilters(){ filters = {cultivar:[], vintage:[], origin:[], sawis:[], farming:[]}; viewListings(); enhanceSelects(app); }
function renderRows(anim){
  const list = LISTINGS.filter(l => matches(l, filters));
  const active = Object.values(filters).some(v => v.length);
  const clr = document.getElementById("fclear"); if (clr) clr.hidden = !active;
  const rows = document.getElementById("rows");
  rows.classList.toggle("anim", !!anim && !REDUCED);
  rows.innerHTML = list.length ? list.map(rowHTML).join("")
    : `<div class="empty">No wines match these filters. <button type="button" id="eclear">Clear filters</button></div>`;
  const ec = document.getElementById("eclear"); if (ec) ec.addEventListener("click", clearFilters);
}

  grape:`<svg viewBox="0 0 44 44"><path d="M22 9c0-3 1-5 3-6M22 9c-2-3-5-4-8-3 1 3 4 4 8 3"/><circle cx="16" cy="14" r="4.5"/><circle cx="25" cy="14" r="4.5"/><circle cx="11.5" cy="22" r="4.5"/><circle cx="20.5" cy="22" r="4.5"/><circle cx="29.5" cy="22" r="4.5"/><circle cx="16" cy="30" r="4.5"/><circle cx="25" cy="30" r="4.5"/><circle cx="20.5" cy="38" r="4.5"/></svg>`,

function viewDetail(id){
  const l = LISTINGS.find(x=>x.id===id);
  if (!l){ location.hash = "#listings"; return; }
  const blend = l.cultivars.map(c=>`${c[1]}% ${c[0]}`).join(", ");
  app.innerHTML = `
  <div class="wrap">
    <div class="actions">
      ${backLink("#wine-" + l.id)}
      <a class="btn-out" href="#chat-${l.id}">Contact Seller</a>

        <div class="attr">${ICONS.bottle}<span class="lbl">${l.bottle?"Bottle Ready":"Not Bottle Ready"}</span></div>
        <div class="attr">${ICONS.barrel}<span class="lbl">${l.wooded?"Wooded":"Not Wooded"}</span></div>
        <div class="attr">${ICONS.leaf}<span class="lbl">${esc(l.farming)}</span></div>
      </div>
      <section class="d-sec"><h2>Wine Description</h2><p>${esc(l.desc || "No description added.")}</p></section>
      <section class="d-sec"><h2>Accreditations</h2><p>${esc(l.accreditations.length ? l.accreditations.join(", ") : "None")}</p></section>
      <section class="d-sec"><h2>Chemical Analysis</h2>
        <div class="tbl-wrap"><table class="chem"><tr>${CHEM_HEAD.map(h=>`<th>${h}</th>`).join("")}</tr>

      </section>
    </article>
  </div>`;
  app.querySelectorAll("[data-act]").forEach(b => b.addEventListener("click", () => toast(b.dataset.act)));
  app.querySelector("[data-sample]").addEventListener("click", e => { pendingSample = e.currentTarget.dataset.sample; location.hash = "#chat-" + pendingSample; });
}

/* ---------- Sell view ---------- */

  $("s-qty").addEventListener("input", cost); $("s-price").addEventListener("input", cost);

  const pctLeft = () => 100 - blend.reduce((a,c)=>a+c.pct,0);
  const syncCult = () => {
    const on = !!$("c-name").value;

  const drawBlend = () => {
    $("blend").innerHTML = blend.map((c,i)=>`<span class="chip">${c.pct}% ${esc(c.name)}${c.vintage?` (${c.vintage})`:""}<button type="button" data-i="${i}" aria-label="Remove ${esc(c.name)}">×</button></span>`).join("");

  $("sf").addEventListener("submit", e => {

    if (!blend.length){ $("c-hint").hidden = false; $("c-hint").classList.add("err"); bad++; }
    if (bad){ toast("Fill in the fields marked with * to upload your listing"); return; }
    const sorted = [...blend].sort((a,b)=>b.pct-a.pct);
    const l = {
      id: String(Date.now()), mine: true,
      vintage: +$("s-vintage").value || +(blend.find(c=>c.vintage)||{}).vintage || 2017,
      cultivars: sorted.map(c=>[c.name,c.pct]),
      region: $("s-origin").value || "Western Cape",
      sawis: $("s-sawis").checked && !!$("s-wsb").value.trim(),
      price: parseFloat($("s-price").value.replace(",", ".")),
      qty: parseInt($("s-qty").value.replace(/\s/g,""),10),
      type: $("s-type").value,
      estate: $("s-show").checked && $("s-company").value.trim() ? $("s-company").value.trim() : "Name withheld by seller",
      bottle: $("s-bottle").value === "1", wooded: $("s-wood").checked, farming: $("s-farming").value,
      accreditations: [...app.querySelectorAll(".checks input:checked")].map(i=>i.value),
      desc: $("s-desc").value.trim(), chem: null
    };
    LISTINGS.unshift(l);
    location.hash = "#wine-" + l.id;
    setTimeout(()=>toast("Your listing is live"), 50);
  });
  app.querySelectorAll(".sell select,.sell input").forEach(el => el.addEventListener("input", () => el.closest(".invalid")?.classList.remove("invalid") || el.classList.remove("invalid")));
}

/* ---------- Deal room (chat) ---------- */
const CHATS = {};
let ROLE = "buyer";
let pendingSample = null;
const fmtL = n => Number(n).toLocaleString("en-ZA").replace(/[ ,.]/g," ");
const SVG = {
  clip:`<svg viewBox="0 0 24 24"><path d="M21 11.5l-8.6 8.6a5 5 0 0 1-7.1-7.1l8.6-8.6a3.3 3.3 0 0 1 4.7 4.7l-8.6 8.6a1.7 1.7 0 0 1-2.4-2.4l7.9-7.9"/></svg>`,
  send:`<svg viewBox="0 0 24 24"><path d="M22 2L11 13M22 2l-7 20-4-9-9-4z"/></svg>`,
  x:`<svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>`,
  ok:`<svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7"/></svg>`
};
function code(seed){ const c="abcdefghijkmnopqrstuvwxyzABCDEFGHJKLMNPQRSTUVWXYZ0123456789"; let x=(seed*7919)%233280, s=""; for(let i=0;i<16;i++){ x=(x*9301+49297)%233280; s+=c[x%c.length]; } return s; }
function chatFor(l){
  if (CHATS[l.id]) return CHATS[l.id];
  const n = (parseInt(l.id,10) % 1000) || 1;
  const litres = Math.max(1000, Math.round(l.qty*0.0525/1000)*1000);
  const p = Math.max(1, Math.round(l.price*0.85*2)/2);
  CHATS[l.id] = {active:0, threads:[
    {code:code(n), ago:"4d", closed:false, events:[
      {k:"sample", by:"buyer", units:3, status:"accepted", ago:"6d"},
      {k:"sample-ok", by:"seller", units:3, ago:"6d"},
      {k:"offer", by:"buyer", litres, price:p, status:"accepted", ago:"5d"},
      {k:"sample", by:"buyer", units:3, status:"pending", ago:"4d"},
      {k:"offer-ok", by:"seller", litres, price:p, ago:"4d"}]},
    {code:code(n+17), ago:"4d", closed:false, events:[
      {k:"offer", by:"buyer", litres:Math.max(1000, Math.round(litres*0.6/1000)*1000), price:Math.max(1,p-0.5), status:"pending", ago:"4d"}]}
  ]};
  return CHATS[l.id];
}
function cardHTML({e,i}){
  const mine = e.by === ROLE;
  const off = e.litres ? `${fmtL(e.litres)} litres @ R${rand(e.price)} per litre` : "";
  let title = "", body = "", note = "";
  switch (e.k){
    case "offer": title = "Offer"; body = mine ? `You offered ${off}.` : `An offer of ${off} was proposed.`; break;
    case "sample": title = "Sample Request"; body = mine ? `You requested a sample of ${e.units} units.` : `A sample of ${e.units} units is being requested.`; break;
    case "offer-ok": title = "Offer Accepted"; body = mine ? `You accepted this offer of ${off}.` : `The seller accepted your offer of ${off}.`; break;
    case "offer-no": title = "Offer Declined"; body = mine ? `You declined this offer of ${off}.` : `The seller declined your offer of ${off}.`; break;
    case "sample-ok": title = "Sample Request Accepted"; body = mine ? `You accepted the request for a sample of ${e.units} units.` : `The seller accepted your request for a sample of ${e.units} units.`; break;
    case "sample-no": title = "Sample Request Declined"; body = mine ? `You declined the request for a sample of ${e.units} units.` : `The seller declined your request for a sample of ${e.units} units.`; break;
    case "closed": title = "Sale Closed"; body = mine ? "You closed this sale. The buyer can no longer send messages." : "The seller closed this sale."; break;
    default: body = esc(e.text);
  }
  const pending = (e.k === "offer" || e.k === "sample") && e.status === "pending";
  const actionable = pending && !mine;
  if (pending && mine) note = "Waiting for the seller to respond";
  return `<article class="msg ${mine ? "mine" : "theirs"}${e.fresh ? " fresh" : ""}">
    ${title ? `<header><h3>${title}</h3><time>${e.ago}</time></header>` : `<time class="t-only">${e.ago}</time>`}
    <p>${body}</p>
    ${actionable ? `<div class="msg-actions"><button class="btn-out" type="button" data-decline="${i}" aria-label="Decline">${SVG.x}</button><button class="btn-apply" type="button" data-accept="${i}" aria-label="Accept">${SVG.ok}</button></div>` : ""}
    ${note ? `<div class="msg-note">${note}</div>` : ""}
  </article>`;
}
function threadMeta(t){
  const st = [];
  if (t.events.some(e => e.k === "offer")) st.push("Offer Made");
  if (t.events.some(e => e.k === "sample")) st.push("Sample Request");
  if (t.closed) st.push("Closed");
  const pend = t.events.filter(e => (e.k === "offer" || e.k === "sample") && e.status === "pending" && e.by !== ROLE).length;
  return {st, pend};
}
function drawChat(l){
  const c = chatFor(l);
  if (ROLE === "buyer") c.active = 0;
  const visible = ROLE === "buyer" ? [c.threads[0]] : c.threads;
  const t = c.threads[c.active];
  document.getElementById("chat-title").textContent = ROLE === "seller" ? "Selling" : "Buying";
  app.querySelectorAll("[data-role]").forEach(b => b.setAttribute("aria-pressed", b.dataset.role === ROLE));
  document.getElementById("threads").innerHTML = visible.map((th,i) => {
    const m = threadMeta(th);
    return `<button class="thread" type="button" data-thread="${i}" aria-current="${i === c.active}">
      <span class="t1">Sale ${th.ago}${m.pend ? `<span class="badge" aria-label="${m.pend} waiting for you">${m.pend}</span>` : ""}</span>
      <span class="code">${th.code}</span><span class="st">${m.st.join("<br>")}</span></button>`;
  }).join("");
  document.getElementById("convo").innerHTML = `
    <div class="convo-bar"><button class="icon-btn" type="button" data-attach aria-label="Attach a file">${SVG.clip}</button>
      ${ROLE === "seller" ? `<span class="vr-s" aria-hidden="true"></span><button class="link-wine" type="button" id="close-sale" ${t.closed ? "disabled" : ""}>${t.closed ? "Sale Closed" : "Close Sale"}</button>` : ""}</div>
    <form class="composer" id="composer"><textarea class="fld" id="msg" rows="2" placeholder="${t.closed ? "This sale is closed" : "Enter a message"}" ${t.closed ? "disabled" : ""} aria-label="Message"></textarea>
      <button class="send" type="submit" aria-label="Send message" ${t.closed ? "disabled" : ""}>${SVG.send}</button></form>
    <div class="feed" id="feed">${t.events.map((e,i) => ({e,i})).reverse().map(cardHTML).join("")}</div>`;
  t.events.forEach(e => delete e.fresh);
  updateBadge();
}
function viewChat(id){
  const l = LISTINGS.find(x => x.id === id);
  if (!l){ location.hash = "#listings"; return; }
  const c = chatFor(l);
  if (pendingSample === id){
    pendingSample = null; ROLE = "buyer"; c.active = 0;
    c.threads[0].events.push({k:"sample", by:"buyer", units:3, status:"pending", ago:"now", fresh:true});
    if (!SAMPLES.some(s => s.id === id)) SAMPLES.unshift({id, step:0, units:3, upd:"now"});
    setTimeout(() => toast("Sample requested"), 50);
  }
  app.innerHTML = `<div class="wrap chat-page">
    <div class="crumb">${backLink("#chat-" + id)}</div>
    <div class="chat-head"><h1 id="chat-title"></h1>
      <div class="seg" role="group" aria-label="View as"><span>View as</span><button type="button" data-role="buyer">Buyer</button><button type="button" data-role="seller">Seller</button></div></div>
    <a class="row" data-type="${l.type}" href="#wine-${l.id}">
      <div class="main"><div><h3>${esc(title(l))}</h3><div class="sub">${esc(l.region)}</div></div>${l.sawis ? '<div class="cert">SAWIS Certified</div>' : ''}</div>
      <div class="price"><b>R${rand(l.price)} pL</b><span>${litres(l.qty)}</span></div>
    </a>
    <div class="chat"><aside class="threads" id="threads" aria-label="Conversations"></aside><section class="convo" id="convo" aria-label="Conversation"></section></div>
  </div>`;
  const thread = () => c.threads[c.active];
  const send = () => {
    const ta = document.getElementById("msg"); const txt = ta.value.trim();
    if (!txt || thread().closed) return;
    thread().events.push({k:"text", by:ROLE, text:txt, ago:"now", fresh:true});
    drawChat(l); document.getElementById("msg").focus();
  };
  app.querySelector(".seg").addEventListener("click", e => { const b = e.target.closest("[data-role]"); if (b && b.dataset.role !== ROLE){ ROLE = b.dataset.role; drawChat(l); } });
  const box = app.querySelector(".chat");
  box.addEventListener("click", e => {
    const th = e.target.closest("[data-thread]");
    if (th){ c.active = +th.dataset.thread; drawChat(l); return; }
    const a = e.target.closest("[data-accept],[data-decline]");
    if (a){
      const ok = a.hasAttribute("data-accept"), t = thread(), ev = t.events[+(ok ? a.dataset.accept : a.dataset.decline)];
      ev.status = ok ? "accepted" : "declined";
      t.events.push({k: ev.k + (ok ? "-ok" : "-no"), by:ROLE, litres:ev.litres, price:ev.price, units:ev.units, ago:"now", fresh:true});
      drawChat(l); toast(`${ev.k === "offer" ? "Offer" : "Sample request"} ${ok ? "accepted" : "declined"}`); return;
    }
    if (e.target.closest("[data-attach]")){ toast("Attachments aren’t part of the prototype yet"); return; }
    const cs = e.target.closest("#close-sale");
    if (cs){
      if (cs.dataset.confirm){ const t = thread(); t.closed = true; t.events.push({k:"closed", by:ROLE, ago:"now", fresh:true}); drawChat(l); toast("Sale closed"); }
      else { cs.dataset.confirm = "1"; cs.textContent = "Click again to close sale"; }
    }
  });
  box.addEventListener("submit", e => { e.preventDefault(); send(); });
  box.addEventListener("keydown", e => { if (e.target.id === "msg" && e.key === "Enter" && !e.shiftKey){ e.preventDefault(); send(); } });
  drawChat(l);
}

      <section class="panel" id="d-saved" aria-labelledby="h-saved">
        <div class="panel-head"><h2 id="h-saved">Saved</h2>
          <div class="tabs" role="tablist" aria-label="Saved"><button type="button" role="tab" data-tab="wines">Wines (<span id="cnt-w"></span>)</button><button type="button" role="tab" data-tab="searches">Searches (${SAVED_SEARCHES.length})</button></div></div>
        <div id="saved-body"></div>
      </section>
      <section class="panel" id="d-samples" aria-labelledby="h-samp">
        <div class="panel-head"><h2 id="h-samp">Sample tracker</h2></div>
        <ul class="mini">${samples.map(sampleLi).join("")}</ul>
      </section>`;
    drawSaved();
  } else {
    body.innerHTML = `
      <section class="panel" id="d-attn" aria-labelledby="h-attn">
        <div class="panel-head"><h2 id="h-attn">Waiting on you</h2></div>
        ${att.length ? `<ul class="mini">${att.map(attnLi).join("")}</ul>` : `<p class="caught">You’re all caught up.</p>`}
      </section>
      <section class="panel" id="d-listings" aria-labelledby="h-list">
        <div class="panel-head"><h2 id="h-list">My listings</h2><a class="lnk-g" href="#sell">+ New listing</a></div>
        <div class="tbl-wrap"><table class="tbl">
          <thead><tr><th>Wine</th><th>Status</th><th class="num">Price</th><th class="num">Views</th><th class="num">Enquiries</th><th></th></tr></thead>
          <tbody>${rows.map(r => `<tr data-type="${r.type}"><td class="w">${r.href ? `<a href="${r.href}">${esc(r.t)}</a>` : `<a data-soon>${esc(r.t)}</a>`}<small>${esc(r.r)}${r.qty ? " · " + litres(r.qty) : ""}</small></td>
            <td>${pillFor(r.status)}</td><td class="num">${r.price ? "R" + rand(r.price) + " pL" : "–"}</td><td class="num">${r.views || "–"}</td><td class="num">${r.enq || "–"}</td>
            <td>${r.status === "Live" ? `<button class="lnk-g" type="button" data-open-chat="${r.id}">Messages</button>` : r.status === "Draft" ? '<a class="lnk-g" href="#sell">Continue</a>' : '<button class="lnk-g" type="button" data-soon>Invoice</button>'}</td></tr>`).join("")}</tbody>
        </table></div>
      </section>`;
  }
  if (animate) fade(body);
}
function placeInd(animate){
  const tabs = document.getElementById("dtabs"); if (!tabs) return;
  const cur = tabs.querySelector('[aria-selected="true"]'), ind = tabs.querySelector(".ind"); if (!cur || !ind) return;
  if (!animate || REDUCED) ind.style.transition = "none";
  ind.style.width = cur.offsetWidth + "px";
  ind.style.transform = `translateX(${cur.offsetLeft}px)`;
  if (!animate || REDUCED){ void ind.offsetWidth; ind.style.transition = ""; }
}
function placeNavInd(){
  const ind = document.querySelector(".nav-ind"); if (!ind) return;
  const cur = document.querySelector(".nav a.lnk.active");
  if (!cur || !cur.offsetWidth){ ind.classList.remove("on"); return; }
  const wasOn = ind.classList.contains("on");
  if (!wasOn || REDUCED) ind.style.transition = "none";
  ind.style.width = cur.offsetWidth + "px";
  ind.style.transform = `translateX(${cur.offsetLeft}px)`;
  if (!wasOn || REDUCED){ void ind.offsetWidth; ind.style.transition = ""; }
  ind.classList.add("on");
}
addEventListener("resize", () => { placeInd(false); placeNavInd(); });
if (document.fonts) document.fonts.ready.then(() => { placeInd(false); placeNavInd(); });
function viewDashboard(){
  app.innerHTML = `<div class="wrap dash">
    <div class="dash-head"><h1>My Dashboard</h1><p class="lede">The wines you’re watching, deals waiting for a reply, and your own listings.</p></div>
    <div class="dtabs" role="tablist" aria-label="Dashboard sections" id="dtabs">
      <button type="button" role="tab" data-dtab="overview">Overview</button><button type="button" role="tab" data-dtab="buying">Buying</button><button type="button" role="tab" data-dtab="selling">Selling</button><span class="ind" aria-hidden="true"></span></div>
    <div id="dash-body"></div>
  </div>`;
  const root = app.querySelector(".dash");
  root.addEventListener("click", e => {
    const v = e.target.closest("[data-dtab],[data-view]");
    if (v){
      const next = v.dataset.dtab || v.dataset.view, target = v.dataset.target;
      if (next !== dashView){ dashView = next; drawDash(true); }
      const el = target && document.getElementById(target);
      const go = el || document.getElementById("dtabs");
      if (el || go.getBoundingClientRect().top < 80) go.scrollIntoView({behavior: REDUCED ? "auto" : "smooth", block:"start"});
      return;
    }
    const t = e.target.closest("[data-tab]"); if (t){ if (dashTab !== t.dataset.tab){ dashTab = t.dataset.tab; drawSaved(); } return; }
    const r = e.target.closest("[data-run]"); if (r){ { const f = SAVED_SEARCHES[+r.dataset.run].f; filters = Object.fromEntries(Object.keys(BLANK).map(k => [k, f[k] ? [f[k]] : []])); } location.hash = "#listings"; return; }
    const rs = e.target.closest("[data-respond]"); if (rs){ const [id, ti] = rs.dataset.respond.split(":"); ROLE = "seller"; chatFor(byId(id)).active = +ti; location.hash = "#chat-" + id; return; }
    const oc = e.target.closest("[data-open-chat]"); if (oc){ ROLE = "seller"; chatFor(byId(oc.dataset.openChat)).active = 0; location.hash = "#chat-" + oc.dataset.openChat; }
  });
  root.addEventListener("change", e => {
    const a = e.target.closest("[data-alert]"); if (!a) return;
    const s = SAVED_SEARCHES[+a.dataset.alert]; s.alerts = a.checked;
    toast(a.checked ? `You’ll get alerts for ${s.label}` : `Alerts off for ${s.label}`);
  });
  drawDash(false);
}

/* ---------- Back links ---------- */
const BACK = {}, SCROLL = {};
let restoreScroll = false;
const ARROW_L = `<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 12H5M11 6l-6 6 6 6"/></svg>`;
function setOrigin(cur, prev){
  if (cur.startsWith("#wine-")){
    if (prev === "#dashboard") BACK[cur] = "#dashboard";
    else if (prev === "#listings" || !BACK[cur]) BACK[cur] = "#listings";
  } else if (cur.startsWith("#chat-")){
    const w = "#wine-" + cur.slice(6);
    if (prev === "#dashboard") BACK[cur] = "#dashboard";
    else if (prev === w || !BACK[cur]) BACK[cur] = w;
  }
}
function backLink(key){
  const href = BACK[key] || "#listings";
  let label = "Back to listings";
  if (href === "#dashboard") label = "Back to My Dashboard";
  else if (href.startsWith("#wine-")){ const l = byId(href.slice(6)); label = l ? title(l) : "Back"; }
  return `<a class="back" href="${href}" data-back>${ARROW_L}<span>${esc(label)}</span></a>`;
}
document.addEventListener("click", e => { if (e.target.closest("[data-back]")) restoreScroll = true; });

/* ---------- Custom dropdowns ---------- */
const REDUCED = matchMedia("(prefers-reduced-motion: reduce)").matches;
function enhanceSelects(root){
  root.querySelectorAll(".select").forEach(wrap => {
    if (wrap.classList.contains("enh")) return;
    const sel = wrap.querySelector("select"); if (!sel) return;
    wrap.classList.add("enh");
    const btn = document.createElement("button");
    btn.type = "button"; btn.className = "dd-btn"; btn.id = sel.id + "-btn";
    btn.setAttribute("aria-haspopup","listbox"); btn.setAttribute("aria-expanded","false");
    btn.setAttribute("aria-label", sel.getAttribute("aria-label") || "");
    btn.innerHTML = "<span></span>";
    const ul = document.createElement("ul");
    ul.className = "dd-list"; ul.setAttribute("role","listbox"); if (sel.multiple) ul.setAttribute("aria-multiselectable","true");
    wrap.append(btn, ul);
    sel.tabIndex = -1; sel.setAttribute("aria-hidden","true");
    let hl = -1;
    const items = () => [...ul.children];
    const anySel = () => [...sel.options].some(o => o.selected && o.value);
    const phText = o => !o.value && sel.multiple && anySel() ? "Clear selection" : o.text;
    const build = () => { ul.innerHTML = [...sel.options].map((o,i) => `<li role="option" data-i="${i}" class="${o.value ? "" : "ph"}" aria-selected="${o.selected && !!o.value}">${esc(phText(o))}</li>`).join(""); };
    const refresh = () => items().forEach((li,j) => { const o = sel.options[j]; li.setAttribute("aria-selected", o.selected && !!o.value); if (!o.value) li.textContent = phText(o); });
    const setHl = i => { const it = items(); hl = Math.max(0, Math.min(it.length-1, i)); it.forEach((li,j) => li.classList.toggle("hl", j === hl)); if (it[hl]) it[hl].scrollIntoView({block:"nearest"}); };
    const open = () => {
      if (sel.disabled) return;
      closeAll(wrap); build();
      const r = btn.getBoundingClientRect();
      wrap.classList.toggle("up", innerHeight - r.bottom < 220 && r.top > 290);
      wrap.classList.add("open"); btn.setAttribute("aria-expanded","true");
      setHl(sel.selectedIndex);
    };
    const close = () => { wrap.classList.remove("open"); btn.setAttribute("aria-expanded","false"); };
    const pick = i => {
      if (sel.multiple){
        const o = sel.options[i];
        if (!o.value) [...sel.options].forEach(x => x.selected = false);
        else { o.selected = !o.selected; sel.options[0].selected = false; }
        sel.dispatchEvent(new Event("change", {bubbles:true}));
        refresh(); syncSelects(); return;
      }
      sel.selectedIndex = i;
      sel.dispatchEvent(new Event("input", {bubbles:true}));
      sel.dispatchEvent(new Event("change", {bubbles:true}));
      close(); btn.focus(); syncSelects();
    };
    wrap._close = close;
    btn.addEventListener("click", () => wrap.classList.contains("open") ? close() : open());
    ul.addEventListener("click", e => { const li = e.target.closest("li"); if (li) pick(+li.dataset.i); });
    ul.addEventListener("mousemove", e => { const li = e.target.closest("li"); if (li && +li.dataset.i !== hl) setHl(+li.dataset.i); });
    btn.addEventListener("keydown", e => {
      const isOpen = wrap.classList.contains("open");
      if (e.key === "ArrowDown" || e.key === "ArrowUp"){ e.preventDefault(); if (!isOpen) open(); else setHl(hl + (e.key === "ArrowDown" ? 1 : -1)); }
      else if ((e.key === "Enter" || e.key === " ") && isOpen){ e.preventDefault(); pick(hl); }
      else if (e.key === "Escape" && isOpen){ e.preventDefault(); close(); }
      else if (e.key === "Tab") close();
    });
  });
  syncSelects();
}
function closeAll(except){ document.querySelectorAll(".select.open").forEach(w => { if (w !== except && w._close) w._close(); }); }
function syncSelects(){
  document.querySelectorAll(".select.enh").forEach(w => {
    const s = w.querySelector("select"), b = w.querySelector(".dd-btn"); if (!s || !b) return;
    const chosen = [...s.options].filter(o => o.selected && o.value);
    b.firstChild.textContent = s.multiple ? (chosen.length === 0 ? s.options[0].text : chosen.length === 1 ? chosen[0].text : `${chosen[0].text} +${chosen.length - 1}`) : ((s.options[s.selectedIndex] || {}).text || "");
    b.disabled = s.disabled;
    b.classList.toggle("ph", !s.value);
    b.classList.toggle("invalid", s.classList.contains("invalid"));
  });
}
document.addEventListener("click", e => { if (!e.target.closest(".select")) closeAll(); syncSelects(); });
["change","input","submit"].forEach(t => document.addEventListener(t, () => syncSelects()));
const hdr = document.querySelector(".hdr");
addEventListener("scroll", () => hdr.classList.toggle("scrolled", scrollY > 4), {passive:true});

/* ---------- Router ---------- */
let booted = false;
function route(){
  const h = location.hash.slice(1) || "listings";
  if (h === "about"){ toast("About isn’t part of the prototype yet"); history.replaceState(null,"",window.__last || "#listings"); return; }
  const prev = window.__last || "";
  if (prev && prev !== "#"+h) SCROLL[prev] = scrollY;
  window.__last = "#"+h;
  setOrigin("#"+h, prev);
  document.querySelectorAll("[data-nav]").forEach(a => a.classList.toggle("active", a.dataset.nav === h));
  placeNavInd();
  const render = () => {
    if (h === "sell") viewSell();
    else if (h.startsWith("wine-")) viewDetail(h.slice(5));
    else if (h.startsWith("chat-")) viewChat(h.slice(5));
    else if (h === "dashboard") viewDashboard();
    else viewListings();
    enhanceSelects(app);
    updateBadge();
    window.scrollTo(0, restoreScroll ? (SCROLL["#"+h] || 0) : 0);
    restoreScroll = false;
  };
  if (!booted || REDUCED){ booted = true; render(); return; }
  if (document.startViewTransition) document.startViewTransition(render);
  else { render(); app.classList.remove("pg-enter"); void app.offsetWidth; app.classList.add("pg-enter"); }
}
addEventListener("hashchange", route);
route();
</script>
